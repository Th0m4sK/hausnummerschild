<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Hausnummer</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Hausnummer</h1>
        <div id="status" class="status" aria-live="polite">
            <span id="statusPunkt" class="punkt"></span>
            <span id="statusText">verbinde&nbsp;&hellip;</span>
        </div>
    </header>

    <main>
        <section class="karte">
            <h2>Vorschau</h2>
            <div id="vorschau" class="vorschau" role="img" aria-label="Vorschau des Schilds">
                <div class="vorschauBalken" data-balken="0"></div>
                <div class="vorschauBalken" data-balken="1"></div>
                <div class="vorschauBalken" data-balken="2"></div>
            </div>
            <p class="hinweis">Balken&nbsp;1 liegt am Dateneingang des Streifens, hier unten.</p>
        </section>

        <section class="karte">
            <h2>Schaltschwellen</h2>
            <div class="zeile">
                <label for="luxEin">Ein unter</label>
                <div class="feld">
                    <input type="number" id="luxEin" min="0" max="50000" step="1" inputmode="decimal">
                    <span class="einheit">lx</span>
                </div>
            </div>
            <div class="zeile">
                <label for="luxAus">Aus über</label>
                <div class="feld">
                    <input type="number" id="luxAus" min="0" max="50000" step="1" inputmode="decimal">
                    <span class="einheit">lx</span>
                </div>
            </div>
            <p id="schwellenWarnung" class="warnung" hidden>
                „Aus“ muss über „Ein“ liegen, sonst flackert das Schild in der Dämmerung.
            </p>
        </section>

        <section class="karte">
            <h2>Gesamthelligkeit</h2>
            <div class="schieber">
                <input type="range" id="helligkeit" min="0" max="100" step="1">
                <output for="helligkeit" id="helligkeitWert">20&thinsp;%</output>
            </div>
            <p class="hinweis">Gilt über alle Balken. Hohe Werte ziehen viel Strom.</p>
        </section>

        <template id="balkenVorlage">
            <section class="karte balken">
                <h2>Balken <span class="nr"></span></h2>
                <div class="zeile">
                    <label>Farbe</label>
                    <div class="feld">
                        <input type="color" class="farbe">
                        <span class="hex"></span>
                    </div>
                </div>
                <div class="schieber">
                    <input type="range" class="prozent" min="0" max="100" step="1">
                    <output class="prozentWert"></output>
                </div>
            </section>
        </template>

        <div id="balken"></div>
    </main>

    <footer>
        <button id="speichern" type="button">Speichern</button>
        <span id="meldung" class="meldung" aria-live="polite"></span>
    </footer>

    <script src="script.js"></script>
</body>

</html>
